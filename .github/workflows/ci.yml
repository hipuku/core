# The gate. One job per check, named exactly as the main ruleset requires them,
# so a failure says which check broke and each can be required on its own. The
# build and the end-to-end suite are slower and only worth waiting for once the
# cheap checks agree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code, it never writes to the repo.
permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `if: always()` on every step after the first, so one failure does not
      # skip the checks after it.
      - name: ESLint
        run: npm run lint

      # House style does not use an em dash. Ratcheted against a baseline rather
      # than absolute: a rule that could only pass after a mechanical rewrite of
      # every file would have been turned off instead of adopted.
      - name: Prose
        if: always()
        run: npm run lint:prose

      # The hardcoded-value gate. The strict-value rule is a warning rather than
      # an error; the count is held by the token-debt step below.
      - name: CSS
        if: always()
        run: npm run lint:css

      # Fails when the count of hardcoded declarations moves in either
      # direction without scripts/token-debt.json moving with it.
      - name: Token debt
        if: always()
        run: npm run lint:tokens

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # `lib/db` connects lazily, so a build needs no reachable database, but
        # better-auth reads its secret at module load, and these values must
        # be present and syntactically valid for the module graph to evaluate.
        # They are deliberately fake: nothing here talks to a real service.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-build-secret-not-used-for-anything-real
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, test]

    # A disposable Postgres, not a shared one: the suite pushes a schema and
    # writes fixture users over whatever is there.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: core_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/core_e2e
      BETTER_AUTH_SECRET: e2e-secret-not-used-for-anything-real
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      # The schema, the seed and the build all happen inside the suite: global
      # setup pushes and seeds, the web server builds and starts.
      - name: End to end
        run: npm run e2e

      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
