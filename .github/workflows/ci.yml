# The gate. Every push and every pull request runs the same three checks that
# are expected to pass locally before committing, plus a production build.
#
# Split into two jobs rather than one: lint, typecheck and test are fast and
# independent, and reporting them together means one run tells you everything
# that is wrong instead of only the first thing. The build is slower and only
# worth waiting for once the cheap checks agree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `if: always()` on each step so one failure does not hide the others.
      # A run that reports "lint failed" and nothing else wastes a round trip.
      - name: Lint
        run: npm run lint

      # House style does not use an em dash. Ratcheted against a baseline rather
      # than absolute: a rule that could only pass after a mechanical rewrite of
      # every file would have been turned off instead of adopted.
      - name: Lint prose
        run: npm run lint:prose

      # The hardcoded-value gate. The strict-value rule is a warning here rather
      # than an error, because core's token layer covers colour, radius and
      # shadow and nothing else: 355 declarations choose a size, a weight or a
      # gap by hand. Failing on all of them today would have meant switching the
      # rule off.
      - name: Lint CSS
        run: npm run lint:css

      # So this is what fails. It asserts the count exactly, in both directions,
      # and step 8 drives it to zero by migrating onto haus, which has the
      # scales core is missing.
      - name: Token debt
        run: npm run lint:tokens

      - name: Typecheck
        if: always()
        run: npm run typecheck

      - name: Test
        if: always()
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # `lib/db` connects lazily, so a build needs no reachable database, but
        # better-auth reads its secret at module load, and these values must
        # be present and syntactically valid for the module graph to evaluate.
        # They are deliberately fake: nothing here talks to a real service.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-build-secret-not-used-for-anything-real
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: check

    # A disposable Postgres, not a shared one: the suite pushes a schema and
    # writes fixture users over whatever is there.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: core_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/core_e2e
      BETTER_AUTH_SECRET: e2e-secret-not-used-for-anything-real
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      # The schema, the seed and the build all happen inside the suite: global
      # setup pushes and seeds, the web server builds and starts.
      - name: End to end
        run: npm run e2e

      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
